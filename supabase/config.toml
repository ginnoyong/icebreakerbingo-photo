
[functions.generate-phrases]
enabled = true
verify_jwt = true
import_map = "./functions/generate-phrases/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/generate-phrases/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/generate-phrases/*.html" ]

# Host-only: saves/checks/revokes the host's Google Drive refresh token.
[functions.store-drive-token]
enabled = true
verify_jwt = true
entrypoint = "./functions/store-drive-token/index.ts"

# Called by players (anon key only, no login) to upload a square's photo to the host's Drive.
[functions.upload-photo]
enabled = true
verify_jwt = true
entrypoint = "./functions/upload-photo/index.ts"

# Host-only: suggests photo captions (with emoji) for a theme, via Groq.
[functions.generate-captions]
enabled = true
verify_jwt = true
entrypoint = "./functions/generate-captions/index.ts"
